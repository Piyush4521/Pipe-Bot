<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="4" fill="#0F172A"/>
  <!-- Circular PVC pipe cross-section -->
  <circle cx="16" cy="16" r="10" stroke="#CBD5E1" stroke-width="2.5" />
  <circle cx="16" cy="16" r="6" stroke="#EA580C" stroke-width="2" />
  <!-- Inspection crosshair / sensor target -->
  <line x1="16" y1="3" x2="16" y2="7" stroke="#EA580C" stroke-width="2" stroke-linecap="square"/>
  <line x1="16" y1="25" x2="16" y2="29" stroke="#EA580C" stroke-width="2" stroke-linecap="square"/>
  <line x1="3" y1="16" x2="7" y2="16" stroke="#EA580C" stroke-width="2" stroke-linecap="square"/>
  <line x1="25" y1="16" x2="29" y2="16" stroke="#EA580C" stroke-width="2" stroke-linecap="square"/>
  <!-- Center camera lens / detector -->
  <circle cx="16" cy="16" r="2" fill="#EA580C" />
</svg>

